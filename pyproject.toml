[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lessons-learned"
version = "0.4.0"
description = "Lessons Learned web app and Datagrid construction agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lessons-learned contributors" }]
dependencies = [
  "datagrid_ai>=0.16.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lessons-learned = "datagrid_agents.cli:main"
datagrid-agents = "datagrid_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datagrid_agents = [
  "definitions/*.yaml",
  "orchestrator/agents.yaml",
]
